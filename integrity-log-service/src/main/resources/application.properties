spring.application.name=integrity-log-service
spring.datasource.url=jdbc:postgresql://localhost:5432/integritylog
spring.datasource.username=integritylog
spring.datasource.password=integritylog
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=8080

logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=DEBUG

integritylog.security.enabled=true
integritylog.security.api-key=${INTEGRITYLOG_API_KEY:change-me-in-production}