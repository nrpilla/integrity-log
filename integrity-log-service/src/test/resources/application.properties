# Use Testcontainers JDBC URL to start an ephemeral PostgreSQL for tests
spring.datasource.url=jdbc:tc:postgresql:16:///testdb
spring.datasource.username=integritylog
spring.datasource.password=integritylog
# Let Flyway run the migrations against the ephemeral DB during tests
spring.flyway.enabled=true
# Ensure API key config is present so security filter beans can be constructed
integritylog.security.api-key=change-me-in-production
integritylog.security.enabled=true
# Keep logging quieter in tests
logging.level.root=INFO
